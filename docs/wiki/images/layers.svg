<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>How shuttle runs a plan</title><desc>Layer 0 holds the nodes with no dependencies, run side by side. Layer 1 waits for all of layer 0, then runs the join. The whole plan is one Temporal workflow and each node is one activity.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="d" x="60" y="40" width="560" height="300" rx="12"/><text class="l" x="72" y="32" text-anchor="start">PlanWorkflow (one Temporal workflow, each box an activity)</text><text class="l" x="80" y="92" text-anchor="start">layer 0</text><g class="p"><rect x="150" y="70" width="110" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="205.0" y="92.0" text-anchor="middle" dominant-baseline="central">n0</text></g><g class="p"><rect x="300" y="70" width="110" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="355.0" y="92.0" text-anchor="middle" dominant-baseline="central">n1</text></g><g class="p"><rect x="450" y="70" width="110" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="505.0" y="92.0" text-anchor="middle" dominant-baseline="central">n2</text></g><text class="l" x="80" y="176" text-anchor="start">barrier</text><path class="w" d="M140 170 L600 170"/><path class="w" d="M205 114 L205 150 C 205 200, 330 196, 340 230"/><path class="w" d="M355 114 L355 230"/><path class="w" d="M505 114 L505 150 C 505 200, 380 196, 370 230"/><text class="l" x="80" y="256" text-anchor="start">layer 1</text><g class="p"><rect x="290" y="230" width="130" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="355.0" y="252.0" text-anchor="middle" dominant-baseline="central">n3 (join)</text></g><path class="w" d="M355 274 L355 316" marker-end="url(#a)"/><text class="l" x="365" y="306" text-anchor="start">Result: outputs by node ID</text><text class="f" x="340" y="370" text-anchor="middle">Within a layer: ⊗ (in parallel). Between layers: ; (wait for all).</text><text class="l" x="340" y="394" text-anchor="middle">Layers come from plan order, never a map: deterministic by construction.</text></svg>
